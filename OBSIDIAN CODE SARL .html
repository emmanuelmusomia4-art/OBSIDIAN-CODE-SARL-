<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1428">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>OBSIDIAN CODE</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --bg: #040a18;
      --sf: #0b1428;
      --tx: #f3f6fc;
      --mu: #a7b4cc;
      --ac: #0a84ff;
      --cy: #22e5f0;
      --ln: #1b2c4d;
      --er: #ff7b6b;
      color-scheme: dark;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }
    body {
      margin: 0;
      padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 4px;
      position: relative;
      z-index: 5;
    }
    .ib {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid var(--ln);
      background: var(--sf);
      display: grid;
      place-items: center;
      padding: 0;
    }
    .ib svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--tx);
      stroke-width: 2.4;
      stroke-linecap: round;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: none;
      font-weight: 800;
      letter-spacing: .02em;
      font-size: 17px;
      padding: 0;
    }
    .logo svg {
      width: 46px;
      height: 46px;
    }
    .logo b {
      color: var(--ac);
    }
    .view {
      display: none;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 4px 48px;
    }
    .view.on {
      display: block;
    }
    .hero {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      min-height: calc(100dvh - 80px);
      background:
        radial-gradient(120% 60% at 90% 40%, #0b3a5a55, transparent 60%),
        radial-gradient(100% 50% at 0% 85%, #0a84ff33, transparent 60%);
      display: none;
      flex-direction: column;
      padding-left: max(20px, calc((100% - 520px) / 2));
      padding-right: max(20px, calc((100% - 520px) / 2));
    }
    .hero.on {
      display: flex;
    }
    .hero::before, .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      z-index: -1;
      pointer-events: none;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }
    .hero::after {
      bottom: 0;
      height: 14%;
      background-position: bottom;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--ln);
      background: #0a1a3380;
      border-radius: 30px;
      padding: 9px 18px;
      font-size: 15px;
      margin: 48px 0 20px;
      align-self: flex-start;
    }
    .badge svg {
      width: 18px;
      height: 18px;
      fill: var(--cy);
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 6vw, 42px);
      line-height: 1.15;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">OBSIDIAN <b>CODE</b></div>
  </header>
  <main class="view hero on">
    <div class="badge">Solutions Numériques &amp; IA</div>
    <h1>OBSIDIAN CODE</h1>
    <p>Site en cours de mise à jour.</p>
  </main>
</body>
</html>
